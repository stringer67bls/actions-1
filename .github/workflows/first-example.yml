name: My First Workflow

on: push

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Welcome message
        run: echo "My first GitHub Actions job"

      - name: List repository files
        run: ls -la

      - name: Read README
        run: cat README.md