name: Generate ASCII Artwork

on: push

jobs:
  ascii-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: List repository files
        run: ls -ltra

      - name: Executing Shell Script
        run: |
             chmod +x ascii-script.sh
            ./ascii-script.sh
